# Render Blueprint for Chat App Backend
# This file helps Render automatically configure your service
# Learn more: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chat-app-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # You'll add this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render will generate a random secret
      - key: GEMINI_API_KEY
        sync: false  # You'll add this manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URL
        sync: false  # You'll add this after deploying frontend

